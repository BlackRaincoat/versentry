#      VERSENTRY_APPRISE_USERNAME, VERSENTRY_APPRISE_PASSWORD, VERSENTRY_APPRISE_PROXY

# --- Rules (optional) ---
# Image axis: per-repo include filters, track: digest, min_age.
# A rule is the base for every container of that image; a container's own
# versentry.include / versentry.track / versentry.min_age labels override it field by field
# (exclusion is the exception: see exclude_containers). See docs/rules.md.
#
# rules:
#   - image: "postgres"
#     include: "^17\\.\\d+-alpine3\\.\\d+$"
#   - image: "chatwoot/chatwoot"
#     include: "^v\\d+\\.\\d+\\.\\d+-ce$"
#   - image: "valkey/valkey"
#     track: digest
#   - image: "grafana/grafana"
#     min_age: 7d        # per-image override of the global min_age (0 = off)
# floating tag rebuilds (e.g. 9-alpine), not semver "newer"

# --- Exclude containers (optional) ---
# Exact Docker names (docker ps) to skip. Complements label versentry.watch=false
# (either source excludes; config cannot force-include against the label).
#
# exclude_containers:
#   - chatwoot-notify
#
# Opt-in instead (many containers, few that matter): check only these names
# and containers labeled versentry.watch=true. Exclusion still wins.
# watch_by_default: false
# watch_containers:
#   - postgres
#   - nextcloud

# --- Timeouts ---
timeouts:
  provider: 10s
  registry: 30s

# registry_proxy: "socks5://user:pass@host:1080"
# Env: VERSENTRY_REGISTRY_PROXY

# --- Scheduling ---
interval: 12h
# schedule: "0 12 * * *"
# timezone: Europe/Paris
# cron only; ignored with interval-only mode

# --- Minimum image age (optional) ---
# Notify only when the new image is at least this old in the registry
# (guards against broken releases re-pushed within a day). Durations accept days.
# Semver: a too-young newest version falls back to the newest old-enough one.
# See docs/configuration.md#minimum-image-age-min_age.
# min_age: 3d

# --- Reminders (optional, versentry run) ---
# Re-send an update you have not applied yet, marked "(reminder)".
# Default: notify each target once. See docs/configuration.md#reminders-remind_after.
# remind_after: 7d
# Cron needs timezone in config or TZ env — see docs/configuration.md#tz-vs-timezone
# TZ in compose/docker is separate: it sets log timestamps for the whole container.

# --- State & health ---
# Notification state is internal (suppresses repeat alerts). Default: state.json next to this file.
# Docker image sets VERSENTRY_STATE_FILE=/data/state.json — mount a volume at /data; no YAML key needed.
# health_max_age: "3h"

log_level: info
